<template>
    <div class="ig-root">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar__left">
                <lightning-icon icon-name="standard:invoice" size="small" class="slds-var-m-right_small"></lightning-icon>
                <span class="slds-text-heading_small">Invoice Generator</span>
                <template lwc:if={invoice}>
                    <span class={statusBadgeClass}>{invoice.Status}</span>
                </template>
            </div>
            <div class="top-bar__right">
                <template lwc:if={isDraft}>
                    <lightning-button
                        variant="brand"
                        label="Post Invoice"
                        onclick={handlePost}
                        disabled={isLoading}
                        class="slds-var-m-right_x-small">
                    </lightning-button>
                </template>
                <template lwc:if={canCancel}>
                    <lightning-button
                        variant="destructive-text"
                        label="Cancel Invoice"
                        onclick={handleCancel}
                        disabled={isLoading}>
                    </lightning-button>
                </template>
            </div>
        </div>

        <!-- Error Banner -->
        <template lwc:if={errorMessage}>
            <div class="error-banner" role="alert">
                <lightning-icon icon-name="utility:error" alternative-text="Error" size="x-small" class="slds-var-m-right_x-small"></lightning-icon>
                {errorMessage}
            </div>
        </template>

        <!-- Loading -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <template lwc:if={isReady}>
            <div class="ig-body">

                <!-- LEFT: Invoice Preview -->
                <div class="invoice-card">
                    <div class="card-header">Invoice Preview</div>

                    <template lwc:if={invoice}>
                        <div class="invoice-meta-grid">
                            <div class="meta-item">
                                <div class="meta-label">Invoice #</div>
                                <div class="meta-value">{invoice.InvoiceNumber}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Account</div>
                                <div class="meta-value">{invoice.BillingAccount.Name}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Invoice Date</div>
                                <div class="meta-value">{invoice.InvoiceDate}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Due Date</div>
                                <div class="meta-value">{invoice.DueDate}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Total Amount</div>
                                <div class="meta-value meta-value--total">{totalAmountFormatted}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Status</div>
                                <div class="meta-value">{invoice.Status}</div>
                            </div>
                        </div>

                        <template lwc:if={invoice.Description}>
                            <div class="invoice-description">{invoice.Description}</div>
                        </template>
                    </template>

                    <!-- Lines Table -->
                    <template lwc:if={hasLines}>
                        <div class="table-scroll">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout slds-var-m-top_small">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="col-product"><div class="slds-truncate">Product</div></th>
                                        <th class="col-type"><div class="slds-truncate">Type</div></th>
                                        <th class="col-qty"><div class="slds-truncate">Qty</div></th>
                                        <th class="col-price"><div class="slds-truncate">Unit Price</div></th>
                                        <th class="col-amount"><div class="slds-truncate">Amount</div></th>
                                        <th class="col-desc"><div class="slds-truncate">Description</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={lines} for:item="line">
                                        <tr key={line.Id} class="slds-hint-parent">
                                            <td><div class="slds-truncate">{line.Product2.Name}</div></td>
                                            <td><span class="type-badge">{line.Product2.Product_Type__c}</span></td>
                                            <td>{line.Quantity}</td>
                                            <td>{line.unitPriceFormatted}</td>
                                            <td class="amount-cell">{line.lineAmountFormatted}</td>
                                            <td><div class="slds-truncate slds-text-color_weak">{line.Description}</div></td>
                                        </tr>
                                    </template>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="4" class="slds-text-align_right slds-text-body_small slds-text-color_weak">Total</td>
                                        <td class="amount-cell slds-text-heading_small">{totalAmountFormatted}</td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </template>
                    <template lwc:if={isEmpty}>
                        <div class="empty-lines">No invoice lines found.</div>
                    </template>
                </div>

                <!-- RIGHT: Batch Admin -->
                <div class="batch-card">
                    <div class="card-header">Batch Admin</div>

                    <div class="batch-section">
                        <div class="batch-section-label">Run Now</div>
                        <lightning-button
                            variant="neutral"
                            label="Run Invoice Batch"
                            icon-name="utility:sync"
                            onclick={handleRunBatch}
                            disabled={isLoading}>
                        </lightning-button>
                        <template lwc:if={batchJobId}>
                            <div class="batch-result">Batch started: {batchJobId}</div>
                        </template>
                    </div>

                    <div class="batch-section">
                        <div class="batch-section-label">Schedule</div>
                        <div class="cron-presets">
                            <span class="preset-label">Presets:</span>
                            <template for:each={cronPresets} for:item="preset">
                                <a key={preset.label} class="preset-link" data-cron={preset.cron} onclick={handlePresetClick}>{preset.label}</a>
                            </template>
                        </div>
                        <lightning-input
                            label="Cron Expression"
                            value={cronExpression}
                            onchange={handleCronChange}
                            placeholder="0 0 2 * * ?">
                        </lightning-input>
                        <lightning-input
                            label="Job Name"
                            value={jobName}
                            onchange={handleJobNameChange}
                            placeholder="InvoiceBatch - Daily">
                        </lightning-input>
                        <lightning-button
                            variant="brand"
                            label="Schedule Batch"
                            onclick={handleScheduleBatch}
                            disabled={isLoading}
                            class="slds-var-m-top_x-small">
                        </lightning-button>
                    </div>

                    <!-- Active Jobs -->
                    <div class="batch-section">
                        <div class="batch-section-label">Active Scheduled Jobs</div>
                        <template lwc:if={hasScheduledJobs}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th><div class="slds-truncate">Name</div></th>
                                        <th><div class="slds-truncate">Next Fire</div></th>
                                        <th><div class="slds-truncate">State</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={scheduledJobs} for:item="job">
                                        <tr key={job.id}>
                                            <td><div class="slds-truncate">{job.name}</div></td>
                                            <td>{job.nextFireTime}</td>
                                            <td><span class="type-badge">{job.state}</span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:if={noScheduledJobs}>
                            <div class="empty-lines">No scheduled jobs found.</div>
                        </template>
                    </div>
                </div>

            </div>
        </template>

    </div>
</template>
