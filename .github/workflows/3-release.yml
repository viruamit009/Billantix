name: 3. Release (Promote to Main / Create Package / Promote Package)

on:
  workflow_dispatch:
    inputs:
      promoteToMain:
        description: "Promote UAT to Main"
        type: boolean
        default: true
      createPackageVersion:
        description: "Create Package Version (runs against main)"
        type: boolean
        default: true
      promotePackageVersion:
        description: "Promote Package Version to Released (irreversible)"
        type: boolean
        default: false
      packageVersionIdToPromote:
        description: "Package version Id to promote (04t...) — only needed if NOT also creating one in this same run"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote-to-main:
    if: inputs.promoteToMain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward main to UAT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin UAT
          git merge --ff-only origin/UAT
          git push origin main

  create-package-version:
    needs: promote-to-main
    if: always() && inputs.createPackageVersion && (needs.promote-to-main.result == 'success' || needs.promote-to-main.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      versionId: ${{ steps.create.outputs.versionId }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check for changes under force-app since last package version
        id: change-check
        run: |
          LAST_MARKER_SHA=$(git log --grep="^chore: record new Billantix package version" -1 --format=%H || true)
          if [ -z "$LAST_MARKER_SHA" ]; then
            echo "No previous package version commit found — proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_MARKER_SHA" HEAD -- force-app; then
            echo "No changes under force-app/ since the last package version was created ($LAST_MARKER_SHA) — nothing to package."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Salesforce CLI
        if: steps.change-check.outputs.has_changes == 'true'
        run: npm install --global @salesforce/cli

      - name: Authenticate to Dev Hub
        if: steps.change-check.outputs.has_changes == 'true'
        run: |
          echo "${{ secrets.DEVHUB_SFDX_AUTH_URL }}" > ./DEVHUB_AUTH_URL.txt
          sf org login sfdx-url -f ./DEVHUB_AUTH_URL.txt -a devhub --set-default-dev-hub
          rm -f ./DEVHUB_AUTH_URL.txt

      - name: Ensure package is registered on Dev Hub
        if: steps.change-check.outputs.has_changes == 'true'
        run: |
          EXISTING_ID=$(sf package list --target-dev-hub devhub --json | jq -r '.result[] | select(.NamespacePrefix == "Billantix") | .Id' | head -n1)
          if [ -z "$EXISTING_ID" ]; then
            echo "No package registered for namespace 'Billantix' on this Dev Hub — creating it."
            sf package create \
              --name Billantix \
              --package-type Managed \
              --path force-app \
              --target-dev-hub devhub \
              --json
          else
            echo "Package already registered on this Dev Hub: $EXISTING_ID"
          fi

      - name: Create package version
        id: create
        if: steps.change-check.outputs.has_changes == 'true'
        run: |
          set +e
          sf package version create \
            --package Billantix \
            --definition-file config/project-scratch-def.json \
            --installation-key-bypass \
            --code-coverage \
            --wait 90 \
            --target-dev-hub devhub \
            --json > version-create-result.json
          CLI_EXIT_CODE=$?
          set -e
          cat version-create-result.json
          VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId // empty' version-create-result.json)
          echo "versionId=$VERSION_ID" >> "$GITHUB_OUTPUT"
          exit $CLI_EXIT_CODE

      - name: Upload result
        if: always() && steps.change-check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-version-create-result
          path: version-create-result.json

      - name: Commit updated sfdx-project.json
        if: steps.change-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sfdx-project.json; then
            git add sfdx-project.json
            git commit -m "chore: record new Billantix package version [skip ci]"
            git push
          fi

  promote-package-version:
    needs: create-package-version
    if: always() && inputs.promotePackageVersion && (needs.create-package-version.result == 'success' || needs.create-package-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: package-promote
    steps:
      - name: Determine version to promote
        id: determine
        run: |
          FROM_JOB="${{ needs.create-package-version.outputs.versionId }}"
          FROM_INPUT="${{ inputs.packageVersionIdToPromote }}"
          if [ -n "$FROM_JOB" ]; then
            echo "Using version created earlier in this same run: $FROM_JOB"
            echo "versionId=$FROM_JOB" >> "$GITHUB_OUTPUT"
          elif [ -n "$FROM_INPUT" ]; then
            echo "Using version Id provided as input: $FROM_INPUT"
            echo "versionId=$FROM_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No package version Id available to promote — either enable createPackageVersion in this run, or provide packageVersionIdToPromote."
            exit 1
          fi

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Dev Hub
        run: |
          echo "${{ secrets.DEVHUB_SFDX_AUTH_URL }}" > ./DEVHUB_AUTH_URL.txt
          sf org login sfdx-url -f ./DEVHUB_AUTH_URL.txt -a devhub --set-default-dev-hub
          rm -f ./DEVHUB_AUTH_URL.txt

      - name: Promote package version
        run: |
          sf package version promote \
            --package "${{ steps.determine.outputs.versionId }}" \
            --target-dev-hub devhub \
            --no-prompt \
            --json
