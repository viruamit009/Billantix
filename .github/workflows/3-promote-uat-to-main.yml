name: 3. Promote UAT to Main

on:
  workflow_dispatch: {}

concurrency:
  group: promote-uat-to-main
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require running from UAT
        run: |
          if [ "${{ github.ref }}" != "refs/heads/UAT" ]; then
            echo "::error::This workflow can only be run against the 'UAT' branch. You selected '${{ github.ref_name }}'. Re-run it with 'UAT' picked in the branch dropdown."
            exit 1
          fi

  promote-to-main:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Merge UAT into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin UAT
          git merge origin/UAT --no-edit -m "Merge UAT into main"
          git push origin main
